<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>学校コンパス</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0a1324">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="学校コンパス"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0a1324;--ink:#f4f7ff;--sub:rgba(228,236,255,.62);--faint:rgba(228,236,255,.42);--line:rgba(255,255,255,.14);--acc:#4f7bff;--acc2:#2f5be0;--err:#ff9c9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 background-color:var(--bg);
 background-image:radial-gradient(70vmax 60vmax at 12% 0%,rgba(79,123,255,.34),transparent 62%),radial-gradient(60vmax 55vmax at 100% 100%,rgba(122,92,255,.24),transparent 60%),radial-gradient(40vmax 40vmax at 85% 15%,rgba(44,196,214,.12),transparent 60%);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",sans-serif;color:var(--ink);overflow:hidden}
.ruler{position:fixed;left:0;right:0;bottom:0;height:64px;pointer-events:none;opacity:.55;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 12px) left bottom/100% 10px no-repeat,
 repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 1px,transparent 1px 60px) left bottom/100% 20px no-repeat,
 linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)) left bottom/100% 1px no-repeat;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.box{position:relative;width:min(100%,400px);padding:36px 28px 26px;border-radius:28px;text-align:center;
 background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);
 -webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);
 box-shadow:0 30px 80px rgba(2,8,23,.55),inset 0 1px 0 rgba(255,255,255,.12);animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.ic{width:76px;height:76px;margin:0 auto 18px;border-radius:20px;display:block;box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.14)}
h1{font-size:24px;font-weight:800;letter-spacing:.04em;margin:0 0 6px}
p{margin:0 0 24px;font-size:13.5px;color:var(--sub);line-height:1.7}
.fld{position:relative}
input{width:100%;height:56px;font-size:17px;letter-spacing:.06em;padding:0 52px 0 18px;color:var(--ink);background:rgba(255,255,255,.07);
 border:1px solid var(--line);border-radius:16px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--faint);letter-spacing:.02em}
input:focus{border-color:rgba(122,154,255,.9);background:rgba(255,255,255,.10);box-shadow:0 0 0 4px rgba(79,123,255,.25)}
.eye{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s}
.eye:hover{color:var(--ink);background:rgba(255,255,255,.08)}.eye svg{width:22px;height:22px}.eye .off{display:none}.eye.on .on{display:none}.eye.on .off{display:block}
#b{margin-top:14px;width:100%;height:56px;font-size:16px;font-weight:800;letter-spacing:.12em;border:0;border-radius:16px;color:#fff;cursor:pointer;
 background:linear-gradient(180deg,var(--acc),var(--acc2));box-shadow:0 10px 28px rgba(47,91,224,.45),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,filter .2s,opacity .2s}
#b:hover{filter:brightness(1.08)}#b:active{transform:scale(.985)}#b:disabled{opacity:.55;cursor:default;filter:none}
#m{min-height:20px;margin-top:14px;font-size:13px;color:var(--err);font-weight:700;line-height:1.6}
.ft{margin-top:6px;font-size:11.5px;color:var(--faint);letter-spacing:.02em}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.sh{animation:sh .35s}
@media (max-height:560px){.ic{width:56px;height:56px;margin-bottom:12px}.box{padding:24px 22px 18px}p{margin-bottom:16px}}
@media (prefers-reduced-motion:reduce){.box,.sh{animation:none}}
</style></head><body>
<div class="ruler" aria-hidden="true"></div>
<form class="box" id="f" autocomplete="off"><img class="ic" src="apple-touch-icon.png" alt=""><h1>学校コンパス</h1><p>職員専用のアプリです。<br>共通パスワードを入力してください。</p>
<div class="fld"><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
<button class="eye" id="eye" type="button" aria-label="パスワードを表示"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
<button id="b" type="submit">ひらく</button><div id="m" role="alert"></div><div class="ft">15分操作がないと自動でロックされます</div></form>
<script>(function(){var e=document.getElementById('eye'),p=document.getElementById('pw');e.onclick=function(){var s=p.type==='password';p.type=s?'text':'password';e.classList.toggle('on',s);e.setAttribute('aria-label',s?'パスワードを隠す':'パスワードを表示');p.focus()}})();</script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var P=null,INJ="<button id=\"hlk\" type=\"button\" title=\"ロックする\" style=\"position:fixed;right:10px;bottom:10px;z-index:99999;border:1px solid #cbd3df;background:#fffffff0;color:#12233f;border-radius:999px;padding:7px 13px;font:700 13px/1 -apple-system,sans-serif;box-shadow:0 2px 8px #0003;cursor:pointer\">🔒 ロック<\/button>\n<script>(function(){window.HLOCK_MIN=15;var last=Date.now();\nfunction lock(){location.reload()}\ndocument.getElementById('hlk').onclick=lock;\n['pointerdown','keydown','touchstart','scroll','wheel'].forEach(function(e){addEventListener(e,function(){last=Date.now()},{passive:true,capture:true})});\nfunction chk(){if(Date.now()-last>window.HLOCK_MIN*60000)lock()}\nsetInterval(chk,10000);document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});})();<\/script>\n",PR=new Promise(function(ok){var sc=document.createElement('script');sc.src='app.enc.js';sc.onload=function(){P=window.HP||false;ok()};sc.onerror=function(){P=false;ok()};document.head.appendChild(sc)});
function d64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var fails=0,f=document.getElementById('f'),pw=document.getElementById('pw'),bt=document.getElementById('b'),m=document.getElementById('m');
f.onsubmit=async function(ev){ev.preventDefault();if(bt.disabled)return;
 if(!(window.crypto&&crypto.subtle)){m.textContent='この開き方では使えません。https のページを Safari/Chrome で開いてください。';return}
 bt.disabled=true;bt.textContent='確認中…';m.textContent='';
 try{await PR;if(!P)throw 'nodata';var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(P.s),iterations:P.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.v)},k,d64(P.c));
  var html=new TextDecoder().decode(pt);html=html.indexOf('</body>')>=0?html.replace('</body>',function(){return INJ+'</body>'}):html+INJ;pw.value='';document.open();document.write(html);document.close();return
 }catch(e){if(e==='nodata'){m.textContent='データを読み込めません。一度、インターネットにつないで開いてください。';bt.disabled=false;bt.textContent='ひらく';return}fails++;f.classList.remove('sh');void f.offsetWidth;f.classList.add('sh');pw.value='';
  var w=fails>=3?Math.min(30,(fails-2)*3):0;m.textContent='パスワードが違います'+(w?'(しばらく待ってから入力してください)':'');
  bt.textContent='ひらく';if(w){var t=w;var iv=setInterval(function(){bt.textContent='待機 '+t+'秒';if(--t<0){clearInterval(iv);bt.disabled=false;bt.textContent='ひらく'}},1000)}else bt.disabled=false;pw.focus()}
};
</script></body></html>
